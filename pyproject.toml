[project]
name = "catvision"
version = "1.13.0"
description = "Make dark games easier to see using only display-level Windows accessibility APIs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.gui-scripts]
catvision = "catvision.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["catvision"]
